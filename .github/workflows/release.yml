name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: ubuntu-latest
            rust: aarch64-unknown-linux-gnu
            asset: linux-aarch64
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            rust: x86_64-unknown-linux-musl
            asset: linux-x86_64-musl
            zigbuild: true
          - os: ubuntu-latest
            rust: aarch64-unknown-linux-musl
            asset: linux-aarch64-musl
            zigbuild: true
          - os: macos-latest
            rust: aarch64-apple-darwin
            asset: darwin-aarch64
          - os: macos-latest
            rust: x86_64-apple-darwin
            asset: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: install cross compiler
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: install zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: build
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.rust }}

      - name: build
        if: matrix.zigbuild != true
        run: cargo build --release --target ${{ matrix.rust }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: stage artifact
        run: cp target/${{ matrix.rust }}/release/zakhar zakhar-${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: zakhar-${{ matrix.asset }}
          path: zakhar-${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*