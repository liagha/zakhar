name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test