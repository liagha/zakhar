[package]
name = "zakhar"
version = "0.1.0"
edition = "2024"
description = "Multi-agent CLI tool for working with AI coding models"
license = "MIT"

# Both a library (embeddable core) and a CLI binary are built from src/.
[lib]
name = "zakhar"
path = "src/lib.rs"
# `lib` (rlib) for the CLI + desktop embedding, `cdylib` so the Android JNI
# bridge can be packaged as a shared library.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "zakhar"
path = "src/main.rs"

[features]
default = []
# Enables the Android JNI bridge in src/android.rs and switches reqwest to
# rustls so the core cross-compiles for Android without OpenSSL/native-tls.
jni = ["dep:jni"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
jni = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
tokio-stream = "0.1"
dirs = "5"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
colored = "2"
regex = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
shellexpand = "3"
glob = "0.3"
libc = "0.2"
urlencoding = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
